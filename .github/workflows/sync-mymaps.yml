name: Sync My Maps

# Google My Maps(네트워크 링크 KML)를 1시간마다 받아 data/trip.kml, data/map.json 갱신
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download KML
        run: |
          curl -fsSL "https://www.google.com/maps/d/kml?forcekml=1&mid=1D4ql3tG6APOUv0yhtxs0ydoX9S_Cy3Q" -o data/trip.kml.new
          grep -q "<Placemark>" data/trip.kml.new
          mv data/trip.kml.new data/trip.kml
      - name: Convert to JSON
        run: python3 tools/kml_to_json.py data/trip.kml data/map.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trip.kml data/map.json
          git commit -m "Sync My Maps"
          git push
